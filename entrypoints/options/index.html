<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tollgate Timer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="wrap">
      <h1>Tollgate Timer</h1>
      <p class="sub" data-i18n="optSub"></p>

      <section>
        <h2 data-i18n="optPresetsHeading"></h2>
        <div class="presets" id="presets"></div>
      </section>

      <section>
        <h2 data-i18n="optParamsHeading"></h2>
        <div class="grid">
          <label>
            <span data-i18n="optFreeVisits"></span>
            <input type="number" id="freeVisits" min="0" max="20" step="1" />
            <small data-i18n="optFreeVisitsHint"></small>
          </label>
          <label>
            <span data-i18n="optBaseSec"></span>
            <input type="number" id="baseSec" min="1" max="600" step="1" />
            <small data-i18n="optBaseSecHint"></small>
          </label>
          <label>
            <span data-i18n="optGrowth"></span>
            <input type="number" id="growth" min="1.05" max="4" step="0.05" />
            <small data-i18n="optGrowthHint"></small>
          </label>
          <label>
            <span data-i18n="optCap"></span>
            <input type="number" id="capMin" min="1" max="120" step="1" />
            <small data-i18n="optCapHint"></small>
          </label>
          <label>
            <span data-i18n="optTau"></span>
            <input type="number" id="tauHours" min="1" max="48" step="0.5" />
            <small data-i18n="optTauHint"></small>
          </label>
          <label>
            <span data-i18n="optCooldown"></span>
            <input type="number" id="cooldownMin" min="1" max="60" step="1" />
            <small data-i18n="optCooldownHint"></small>
          </label>
          <label>
            <span data-i18n="optSessionMax"></span>
            <input type="number" id="sessionMaxMin" min="1" max="240" step="1" />
            <small data-i18n="optSessionMaxHint"></small>
          </label>
        </div>
        <label class="checkbox">
          <input type="checkbox" id="sharedPool" />
          <span data-i18n="optSharedPool"></span>
        </label>
        <p class="preview" id="preview"></p>
      </section>

      <section>
        <h2 data-i18n="optSitesHeading"></h2>
        <p class="note" data-i18n="optSitesNote"></p>
        <textarea id="sites" rows="10" spellcheck="false"></textarea>
      </section>

      <div class="save-row">
        <button id="save" class="btn" data-i18n="optSave"></button>
        <span id="status" class="status"></span>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
